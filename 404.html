<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сторінку не знайдено — Влад</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#08080a;--t1:#f5f5f7;--t2:#a0a0a8;--g1:linear-gradient(135deg,#7c5cff,#6c5ce7);--acc:#6c5ce7;}
body{margin:0;background:var(--bg);color:var(--t1);font-family:'Inter',sans-serif;}
.notfound{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
.notfound .code{font-family:'Space Grotesk',sans-serif;font-size:clamp(64px,14vw,120px);font-weight:900;background:var(--g1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
.notfound h1{font-size:22px;font-weight:700;margin:16px 0 8px;}
.notfound p{color:var(--t2);font-size:15px;margin-bottom:32px;max-width:420px;}
.notfound a{display:inline-flex;align-items:center;gap:9px;padding:14px 28px;background:var(--g1);color:#fff;border-radius:11px;font-size:14.5px;font-weight:600;text-decoration:none;}
</style>
</head>
<body>
<div class="notfound">
  <div class="code">404</div>
  <h1>Такої сторінки не існує</h1>
  <p>Можливо, посилання застаріло або сторінку перенесено. Поверніться на головну — там усі кейси, ціни та контакти.</p>
  <a href="index.html"><i class="fas fa-home"></i><span>На головну</span></a>
</div>
</body>
</html>
